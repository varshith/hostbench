name: Hourly measurement

on:
  schedule:
    # Off-peak minute: GitHub drops or delays schedules at :00, the busiest slot.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One measurement run at a time; never cancel a run that may be mid-commit.
concurrency:
  group: hostbench-measure
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    # Worst case per target is ~150 s (30 s create + 90 s poll + one in-flight 30 s get), ~60 min for 24;
    # samples are only written at the end, so a kill loses the hour. 6 h default would block later runs.
    timeout-minutes: 75
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Checkout pins the SHA from trigger time; a run queued behind another must see that run's commit
      # or the hour dedupe in measure.ts cannot work.
      - name: Sync to current main
        run: git pull --ff-only origin main
      - name: Measure
        env:
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
        run: npm run measure
      - name: Aggregate
        # A skipped (duplicate-hour) run writes no samples; re-aggregating would only bump generatedAt
        # and trigger a pointless commit and deploy.
        run: |
          if git diff --quiet -- data/raw data/runs.jsonl && [ -z "$(git ls-files --others --exclude-standard data/raw)" ]; then
            echo "no new samples; skipping aggregate"
          else
            npm run aggregate
          fi
      - name: Commit data
        id: commit
        run: |
          git config user.name "hostbench-bot"
          git config user.email "hostbench-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no data changes"
          else
            git commit -m "data: hourly measurement $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: measure
    if: needs.measure.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
